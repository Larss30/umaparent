# Parent Grade thresholds. PROVISIONAL: edit the numbers freely.
# Scores are NOT capped; a parent's score maps to the highest grade whose min it reaches.
# In-game letter ranks grade the career rating (stats + skills), not sparks,
# so this app calls the result "Parent Grade".
